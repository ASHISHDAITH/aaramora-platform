name: Responsive browser audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-responsive:
    name: Chromium responsive and navigation checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Audit responsive pages and navigation
        run: python scripts/audit_responsive_browser.py
      - name: Save visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaramora-responsive-visual-audit
          path: artifacts/visual-audit/
          if-no-files-found: warn
          retention-days: 7
