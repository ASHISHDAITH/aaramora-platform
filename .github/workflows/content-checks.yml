name: Content checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website-content:
    name: Website content and safety checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run website content checks
        run: python -m unittest discover -s tests -p 'check_*.py' -v
      - name: Build the empty approved-only retrieval index (no model calls)
        run: python scripts/build_reviewed_corpus.py --output /tmp/aaramora-rag-approved-index.json
      - name: Check local lexical retrieval (no model/network calls)\n        run: python -m unittest tests/check_search_reviewed_corpus.py -v\n      - name: Validate reading library catalogue metadata
        run: python scripts/check_catalogue.py
